name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims_ci_password
          POSTGRES_DB: installation_manager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ims" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ims:ims_ci_password@localhost:5432/installation_manager?schema=public
      TEST_DATABASE_URL: postgresql://ims:ims_ci_password@localhost:5432/installation_manager_test?schema=public
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=ims_ci_password psql -h localhost -U ims -d installation_manager -c "CREATE DATABASE installation_manager_test"
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
